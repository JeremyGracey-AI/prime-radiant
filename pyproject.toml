[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prime-radiant"
version = "0.1.1"
description = "Calibrated forecasting: Metaculus LLM bot (Brier) and CDC FluSight quantile forecaster (WIS)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jeremy Gracey", email = "jeremy.a.gracey@gmail.com" }]
keywords = ["forecasting", "calibration", "flusight", "metaculus", "quantile", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Metaculus thread
    "forecasting-tools>=0.2.92",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    # FluSight epi thread (data layer)
    "pandas>=2.2",
    "pandera>=0.20",
    "epiweeks>=2.3",
    "httpx>=0.27",
    "pyarrow>=17",
    # EXACT pin: LightGBM determinism holds only within one compiled binary —
    # docs state results differ across versions/compilers/systems.
    "lightgbm==4.7.0",
    # <3.12 cap: report PNGs are committed artifacts; hold the rendering series
    # stable within a phase so regeneration diffs stay meaningful.
    "matplotlib>=3.11,<3.12",
    "pyyaml>=6.0.3",
]

[project.scripts]
prime-radiant = "prime_radiant.epi.cli:main"

[project.urls]
Homepage = "https://github.com/JeremyGracey-AI/prime-radiant"
Repository = "https://github.com/JeremyGracey-AI/prime-radiant"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pytest-recording>=0.13",
    # floors match .pre-commit-config.yaml revs so hooks and `uv run` agree
    "ruff>=0.16.5",
    "pyright>=1.1.411",
    "jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260815",
]
# NOTE: python-semantic-release is deliberately NOT a dependency group — its
# tomlkit>=0.15 floor conflicts with gradio 6.26's tomlkit<0.15 cap. It runs
# isolated instead: `uvx python-semantic-release==10.6.2` locally, the
# containerized psr action (same version) in release.yml.
docs = [
    "mkdocs-material>=9.7",
]
# Dev-only deps for the HF Space dashboard (dashboard/). The Space itself never
# installs this package — its requirements.txt is generated by space-deploy.yml.
dashboard = [
    # ==6.26.*: match the Space's README sdk_version exactly — FetchMerck commit
    # 8732e99 is the recorded cost of developing against a different Gradio than
    # the Space runs.
    "gradio==6.26.*",
    # <7 cap: plotly 7 flips layout.geo.fitbounds default, removes
    # figure_factory.create_choropleth and *mapbox traces, and Gradio's bundled
    # plotly.js has no verified plotly-7 support. Declared directly per the
    # Phase F brief (transitive-only via forecasting-tools before this).
    "plotly>=6.9,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prime_radiant"]

# Default hatchling sdists ship the entire working tree (NOTES, handoff briefs,
# serve_data) — scope to the package + release-relevant files. LICENSE rides
# along via the license-files mechanism.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/prime_radiant",
    "psr_parser.py",
    "README.md",
    "CHANGELOG.md",
    "NOTICE",
    "CITATION.cff",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# dashboard/ modules ship flat to the HF Space root and import as siblings.
known-first-party = ["prime_radiant", "panel_data", "panel_plots"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

# dashboard/ is not part of the package: it deploys flat to the Space root, so
# its modules resolve as siblings there and need the same path here and in tests.
[[tool.pyright.executionEnvironments]]
root = "dashboard"
extraPaths = ["dashboard"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["dashboard"]

[tool.semantic_release]
# Runs isolated: `uvx python-semantic-release==10.6.2` locally, the psr action
# (same version) in release.yml — see the dependency-group note above.
version_toml = ["pyproject.toml:project.version"]
# FILE-PATH form is load-bearing: the bare module form cannot import from cwd.
commit_parser = "psr_parser.py:ActorPrefixConventionalParser"
commit_message = "[claude] chore(release): v{version}"
# House rule: one git identity everywhere, agent commits included.
commit_author = "Jeremy Gracey <jeremy.a.gracey@gmail.com>"
# uv.lock carries the project's own version; regenerate AFTER stamping and
# ship it inside the release commit.
build_command = "uv lock && uv build"
assets = ["uv.lock"]
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.changelog]
mode = "update"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, offline, fixture-backed",
    "integration: touches network or the real hub clone",
    "contract: schema/property invariants (offline)",
    "e2e: full pipeline runs",
]

[tool.coverage.run]
source = ["prime_radiant"]

[tool.coverage.report]
show_missing = true
