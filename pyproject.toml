[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prime-radiant"
version = "0.1.0"
description = "Calibrated forecasting: Metaculus LLM bot (Brier) and CDC FluSight quantile forecaster (WIS)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jeremy Gracey", email = "jeremy.a.gracey@gmail.com" }]
keywords = ["forecasting", "calibration", "flusight", "metaculus", "quantile", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Metaculus thread
    "forecasting-tools>=0.2.92",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    # FluSight epi thread (data layer)
    "pandas>=2.2",
    "pandera>=0.20",
    "epiweeks>=2.3",
    "httpx>=0.27",
    "pyarrow>=17",
    # EXACT pin: LightGBM determinism holds only within one compiled binary —
    # docs state results differ across versions/compilers/systems.
    "lightgbm==4.7.0",
    # <3.12 cap: report PNGs are committed artifacts; hold the rendering series
    # stable within a phase so regeneration diffs stay meaningful.
    "matplotlib>=3.11,<3.12",
    "pyyaml>=6.0.3",
]

[project.scripts]
prime-radiant = "prime_radiant.epi.cli:main"

[project.urls]
Homepage = "https://github.com/JeremyGracey-AI/prime-radiant"
Repository = "https://github.com/JeremyGracey-AI/prime-radiant"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pytest-recording>=0.13",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260815",
]
# Dev-only deps for the HF Space dashboard (dashboard/). The Space itself never
# installs this package — its requirements.txt is generated by space-deploy.yml.
dashboard = [
    # ==6.26.*: match the Space's README sdk_version exactly — FetchMerck commit
    # 8732e99 is the recorded cost of developing against a different Gradio than
    # the Space runs.
    "gradio==6.26.*",
    # <7 cap: plotly 7 flips layout.geo.fitbounds default, removes
    # figure_factory.create_choropleth and *mapbox traces, and Gradio's bundled
    # plotly.js has no verified plotly-7 support. Declared directly per the
    # Phase F brief (transitive-only via forecasting-tools before this).
    "plotly>=6.9,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prime_radiant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# dashboard/ modules ship flat to the HF Space root and import as siblings.
known-first-party = ["prime_radiant", "panel_data", "panel_plots"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

# dashboard/ is not part of the package: it deploys flat to the Space root, so
# its modules resolve as siblings there and need the same path here and in tests.
[[tool.pyright.executionEnvironments]]
root = "dashboard"
extraPaths = ["dashboard"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, offline, fixture-backed",
    "integration: touches network or the real hub clone",
    "contract: schema/property invariants (offline)",
    "e2e: full pipeline runs",
]

[tool.coverage.run]
source = ["prime_radiant"]

[tool.coverage.report]
show_missing = true
