# House shape: agent-lab precedent (ruff-check before ruff-format, local pyright
# via uv) plus detect-secrets per the Phase G brief. Generated/recorded artifacts
# are excluded from the whitespace fixers so byte-regeneration tests stay exact.
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(serve_data/|reports/|tests/golden/|tests/cassettes/)
      - id: trailing-whitespace
        exclude: ^(serve_data/|reports/|tests/golden/|tests/cassettes/)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(serve_data/|reports/|tests/golden/|tests/cassettes/)

  # ruff-check must run BEFORE ruff-format: the `I` rules sort imports, and
  # the formatter then normalises the result (agent-lab precedent).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.8 # note: no `v` prefix on this repo's tags
    hooks:
      - id: uv-lock

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # pyright runs as `language: system` on purpose: the upstream hook installs
  # into an isolated venv that cannot see this project's dependencies. The
  # gradio import warms its self-generated .pyi stubs (fresh-venv quirk,
  # adversarially found in Phase F).
  - repo: local
    hooks:
      - id: pyright
        name: pyright (uv)
        entry: bash -c 'uv run --frozen python -c "import gradio" && uv run --frozen pyright'
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
