# Keeps four surfaces fresh: workflow action SHAs, uv-locked Python deps,
# pre-commit hook revs, and Dockerfile base-image digests. The docker and
# pre-commit ecosystems are deliberate additions over the parent brief's
# actions+uv scope — digest and rev pins rot silently without them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # the image's python tracks the project's deliberate 3.12 pin; only
      # digest/patch refreshes of the same minor are wanted here
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
